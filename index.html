    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="Project-28.css">
        <title>Analog Clock</title>
    </head>
    <body>
        <div id="container">
        <div id="box">
            <div id="hour"><i id="h"></i></div>
            <div id="min"><i class="m"></i></div>
            <div id="sec"><i class="s"></i></div>
            <div id="clock">
                <span class="number" style="--i:1;"><i class="font">1</i></span>
                <span class="number" style="--i:2;"><i class="font">2</i></span>
                <span class="number" style="--i:3;"><i class="font">3</i></span>
                <span class="number" style="--i:4;"><i class="font">4</i></span>
                <span class="number" style="--i:5;"><i class="font">5</i></span>
                <span class="number" style="--i:6;"><i class="font">6</i></span>
                <span class="number" style="--i:7;"><i class="font">7</i></span>
                <span class="number" style="--i:8;"><i class="font">8</i></span>
                <span class="number" style="--i:9;"><i class="font">9</i></span>
                <span class="number" style="--i:10;"><i class="font">10</i></span>
                <span class="number" style="--i:11;"><i class="font">11</i></span>
                <span class="number" style="--i:12;"><i class="font">12</i></span>
            </div>
        </div>
            <button id="ok">LIGHT MODE</button>
        </div>
        <script src="Project-28.js" deder></script>
    </body>
    </html>
